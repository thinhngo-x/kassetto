name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Lint + recommender tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
      - name: Synthetic listener benchmark (report only)
        working-directory: app
        run: python -m recsys.synth --seeds 2 --sessions 30 | tee -a "$GITHUB_STEP_SUMMARY"

  web:
    name: Frontend check, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build

  smoke:
    name: API smoke tests (dev stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Start the dev stack
        run: |
          mkdir -p dev-data && chmod 777 dev-data        # the container runs as a fixed non-root user
          docker compose -f docker-compose.dev.yml up -d --build
          for i in $(seq 60); do curl -sf http://127.0.0.1:18090/healthz && exit 0; sleep 2; done
          docker compose -f docker-compose.dev.yml logs; exit 1
      - run: pytest tests/smoke -v
      - if: failure()
        run: docker compose -f docker-compose.dev.yml logs
      - if: always()
        run: docker compose -f docker-compose.dev.yml down
