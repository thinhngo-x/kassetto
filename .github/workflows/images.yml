name: Images

# Container images on ghcr.io: ghcr.io/thinhngo-x/kassetto and ghcr.io/thinhngo-x/kassetto-embed, amd64 + arm64.
#   a version tag (v0.1.0)   -> :0.1.0, :0.1, :latest (yt-dlp as pinned in the Dockerfile)
#   weekly + by hand         -> :latest rebuilt with the newest yt-dlp (YouTube changes; old yt-dlp stops working)

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.repository == 'thinhngo-x/kassetto'
    runs-on: ubuntu-latest
    timeout-minutes: 90           # an emulated arm64 step that hangs must not burn 6 h
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kassetto
            dockerfile: app/Dockerfile
          - name: kassetto-embed
            dockerfile: app/Dockerfile.embed
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: app
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ github.event_name != 'push' && 'YTDLP=yt-dlp[default]' || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
