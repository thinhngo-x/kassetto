# Development stack for Kassetto: fully separate from any live install on the same machine
# (own project name, containers, network, ports on 127.0.0.1 only, data in ./dev-data).
#   docker compose -f docker-compose.dev.yml up -d --build            # app only
#   docker compose -f docker-compose.dev.yml --profile embed up -d     # + sound fingerprints (2 GB RAM, ~780 MB model)
# Open http://127.0.0.1:18090 (no sign-in proxy in dev: you are the owner "admin").
name: kassetto-dev

# Containers run as PUID:PGID (default 1000:1000): the owner of ./dev-data. Put PUID=/PGID= in .env if yours differ.
services:
  kassetto:
    build: ./app
    image: kassetto:dev
    container_name: kassetto-dev
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: UTC
      KASSETTO_OWNER: admin
      KASSETTO_AUTH: ${KASSETTO_AUTH:-dev}   # dev: Remote-User trusted from anywhere, none = admin. Never in a real install
      KASSETTO_TRUSTED_PROXIES: ${KASSETTO_TRUSTED_PROXIES:-}   # for trying KASSETTO_AUTH=proxy
      KASSETTO_REGION: ${KASSETTO_REGION:-}         # e.g. VN (region.py); empty = off
      MUSIC_STREAM_BASE: http://127.0.0.1:18091
    ports:
      - "127.0.0.1:18090:8090"
      - "127.0.0.1:18091:8091"
    volumes:
      - ./dev-data:/data
    tmpfs: [/tmp]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m

  kassetto-embed:                 # the app looks for this name (KASSETTO_EMBED_URL to change it)
    profiles: [embed]
    build:
      context: ./app
      dockerfile: Dockerfile.embed
    image: kassetto-embed:dev
    container_name: kassetto-dev-embed
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./dev-data:/data
      - ./dev-models:/models
    environment:
      TZ: UTC
      EMBED_THREADS: "2"
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2
